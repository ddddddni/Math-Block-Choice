<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Block Choice</title>
<style>
button { touch-action: manipulation; }
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,sans-serif;
  background:#f9fafb;
  height:100vh;
  overflow:hidden;
  transition:background .3s;
  user-select: none; -webkit-user-select: none;
}

#intro-overlay {
  position: fixed; inset: 0; background-color: rgba(255, 255, 255, 0.85);
  z-index: 9999; display: flex; align-items: center; justify-content: center;
  cursor: pointer; opacity: 1; transition: opacity 0.6s, visibility 0.6s;
}
#intro-overlay p {
  font-size: 28px; font-weight: bold; color: #374151;
  padding: 20px 30px; background: rgba(255,255,255,0.9);
  border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
#intro-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.screen{ display:none; height:100vh; width:100%; flex-direction:column; align-items:center; justify-content:center; }
.active{ display:flex; }

.menu-screen{ position:relative; background:#ffffff; overflow:hidden; }
.math-bg{ position:absolute; inset:0; pointer-events:none; }
.math-bg span{
  position:absolute; font-size:90px; font-weight:900;
  color:#e5e7eb; opacity:0.9; animation:float 6s ease-in-out infinite;
}
.math-bg span:nth-child(1){top:8%;left:12%}
.math-bg span:nth-child(2){top:22%;right:10%}
.math-bg span:nth-child(3){bottom:25%;left:8%}
.math-bg span:nth-child(4){bottom:18%;right:16%}
.math-bg span:nth-child(5){top:55%;left:45%}
.math-bg span:nth-child(6){top:70%;right:35%}
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

.menu-content{ position:relative; z-index:2; text-align:center; padding:20px; }
.logo{ font-size:56px; font-weight:900; line-height:1.1; margin-bottom:14px; }
.subtitle{ color:#6b7280; margin-bottom:20px; }
.highscore-box {
  background: #f3f4f6; padding: 8px 16px; border-radius: 12px;
  display: inline-block; margin-bottom: 30px; font-weight: 600; color: #4b5563;
}

button.primary{
  background:#2563eb; color:white; font-size:20px;
  padding:16px 44px; border-radius:20px; border:none; cursor:pointer;
}
.big{font-size:64px;font-weight:800}
.hud{
  position:fixed; top:0; left:0; width:100%; padding:10px 14px;
  display:flex; justify-content:space-between; align-items:center;
  background:#ffffffcc; backdrop-filter:blur(6px); z-index:10;
}
.game{ padding-top:70px; width:100%; max-width:420px; text-align:center; }
.question{ font-size:40px; margin:30px 0; transition: 0.3s; }
.choices{ display:grid; grid-template-columns:repeat(2,140px); gap:20px; justify-content:center; }
.choice{
  width:140px; height:80px; font-size:28px; color:white;
  border-radius:16px; border:none; background:#2563eb; transition: 0.2s;
}

.gold-mode .question { color: #d97706; font-weight: 900; text-shadow: 0 0 10px #fde68a; }
.gold-mode .choice { background: #d97706 !important; box-shadow: 0 0 15px #fbbf24; }
.bonus-label { color: #d97706; font-weight: bold; display: none; margin-bottom: 10px; }

.success-pop { animation: successPop 0.4s; background: #22c55e !important; }
@keyframes successPop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
.error-shake { animation: errorShake 0.4s; background: #ef4444 !important; }
@keyframes errorShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-8px)} }
</style>
</head>
<body>

<div id="intro-overlay" onclick="handleTapStart()">
  <p>แตะหน้าจอเพื่อเริ่มเกม</p>
</div>

<div id="menu" class="screen active menu-screen">
  <div class="math-bg"><span>＋</span><span>－</span><span>×</span><span>÷</span><span>＋</span><span>×</span></div>
  <div class="menu-content">
    <h1 class="logo">Math<br>Block<br>Choice</h1>
    <p class="subtitle">คิดเร็ว • เลือกไว • ฝึกสมอง</p>
    <div class="highscore-box">🏆 สถิติสูงสุด: <span id="menuHighScore">0</span></div><br>
    <button class="primary" onclick="startGame()">เริ่มเกม</button>
  </div>
</div>

<div id="countdown" class="screen">
  <div class="big" id="countNum">3</div><p>เตรียมพร้อม</p>
</div>

<div id="game" class="screen">
  <div class="hud">
    <div>❤️ <span id="heart">3</span> | 🏆 <span id="score">0</span></div>
    <div style="font-weight:bold">⏱ <span id="time">10</span></div>
    <button onclick="pauseGame()" style="background:#e5e7eb; padding:6px 12px; border-radius:10px; border:none">หยุด</button>
  </div>
  <div class="game" id="gameArea">
    <div id="bonusLabel" class="bonus-label">✨ BONUS: +1 HEART ✨</div>
    <div class="question" id="question"></div>
    <div class="choices">
      <button id="btn0" class="choice" onclick="choose(0)"></button>
      <button id="btn1" class="choice" onclick="choose(1)"></button>
      <button id="btn2" class="choice" onclick="choose(2)"></button>
      <button id="btn3" class="choice" onclick="choose(3)"></button>
    </div>
  </div>
</div>

<div id="pause" class="screen">
  <h2>หยุดเกม</h2><br>
  <button class="primary" onclick="resumeGame()">เล่นต่อ</button><br><br>
  <button onclick="backMenu()">กลับหน้าแรก</button>
</div>

<div id="over" class="screen">
  <div class="big">GAME OVER</div>
  <p style="font-size:20px; margin:10px 0;">คะแนนของคุณ: <span id="final" style="font-weight:bold">0</span></p>
  <p id="newRecordMsg" style="color:orange; font-weight:bold; display:none">🎉 สถิติใหม่! 🎉</p><br>
  <button class="primary" onclick="startGame()">เล่นอีกครั้ง</button><br><br>
  <button onclick="backMenu()">กลับหน้าแรก</button>
</div>

<script>
let score=0, heart=3, time=10, timer=null, paused=false, correctIndex=0;
let isBonus=false, bonusCooldown=false, lastQuestionText="";
let highScore = parseInt(localStorage.getItem('mathBlockHighScore')) || 0;
const $ = id => document.getElementById(id);
$("menuHighScore").textContent = highScore;

let audioCtx = null, soundBuffers = {}, bgSources = {};

async function loadSound(name, url) {
  const resp = await fetch(url);
  const ab = await resp.arrayBuffer();
  soundBuffers[name] = await audioCtx.decodeAudioData(ab);
}

function playSFX(name) {
  if (!audioCtx || !soundBuffers[name]) return;
  const src = audioCtx.createBufferSource();
  src.buffer = soundBuffers[name];
  src.connect(audioCtx.destination);
  src.start(0);
}

function playBGM(type) {
  stopAllBGM();
  if (!audioCtx || !soundBuffers[type]) return;
  const src = audioCtx.createBufferSource();
  src.buffer = soundBuffers[type];
  src.loop = true;
  const gn = audioCtx.createGain(); gn.gain.value = 0.4;
  src.connect(gn).connect(audioCtx.destination);
  src.start(0);
  bgSources[type] = { src, gn, startTime: audioCtx.currentTime, pausedAt: 0 };
}

function stopAllBGM() {
  for (let k in bgSources) { if (bgSources[k]) { try{bgSources[k].src.stop()}catch(e){} bgSources[k]=null; } }
}

async function handleTapStart() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  const snds = [['menu','sound/bg_menu.mp3'],['game','sound/bg_game.mp3'],['bonus','sound/bonus.mp3'],['click','sound/click.mp3'],['correct','sound/correct.mp3'],['wrong','sound/wrong.mp3'],['over','sound/gameover.mp3']];
  await Promise.all(snds.map(s => loadSound(s[0], s[1])));
  $("intro-overlay").classList.add("hidden");
  playSFX('click');
  playBGM('menu');
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function saveHighScore() {
  if (score > highScore) { highScore = score; localStorage.setItem('mathBlockHighScore', highScore); return true; }
  return false;
}

function startGame(){
  playSFX('click'); stopAllBGM();
  score=0; heart=3; isBonus=false; bonusCooldown=false; lastQuestionText="";
  $("score").textContent=score; $("heart").textContent=heart;
  showScreen('countdown');
  let c=3; $("countNum").textContent=c;
  let ct = setInterval(()=>{
    c--;
    if(c>0) { $("countNum").textContent=c; playSFX('click'); }
    else { clearInterval(ct); showGame(); }
  },1000);
}

function showGame(){ paused=false; showScreen('game'); nextQuestion(); }
function pauseGame(){ playSFX('click'); paused=true; showScreen('pause'); }
function resumeGame(){ playSFX('click'); paused=false; showScreen('game'); }

function backMenu(){ 
  playSFX('click'); clearInterval(timer); saveHighScore();
  stopAllBGM(); playBGM('menu');
  $("menuHighScore").textContent = highScore;
  showScreen('menu'); 
}

function nextQuestion(){
  clearInterval(timer);
  time=10; $("time").textContent=time;
  for(let i=0; i<4; i++) $("btn"+i).className = 'choice';
  
  // เงื่อนไขสุ่มข้อโบนัส (ต้องไม่ติดกัน)
  if (heart < 3 && !bonusCooldown && Math.random() < 0.2) {
    isBonus = true;
    bonusCooldown = true; // ล็อกไว้สำหรับข้อหน้า
  } else {
    isBonus = false;
    bonusCooldown = false; // ปลดล็อก
  }

  $("gameArea").className = isBonus ? "game gold-mode" : "game";
  $("bonusLabel").style.display = isBonus ? "block" : "none";
  if(isBonus) playBGM('bonus'); else if(!bgSources['game']) playBGM('game');

  let currentExpr = "", ans = 0;
  
  // ระบบป้องกันโจทย์ซ้ำ
  do {
    let numCount = isBonus ? 4 : (score > 300 ? 3 : (score > 100 && Math.random() < 0.6 ? 3 : 2));
    currentExpr = "";
    for(let i=0; i<numCount; i++){
      let n = Math.floor(Math.random()*10)+1;
      if(i===0) { currentExpr = n; ans = n; }
      else {
        let op = Math.random() > 0.5 ? "+" : "-";
        currentExpr += ` ${op} ${n}`;
        ans = (op === "+") ? ans + n : ans - n;
      }
    }
  } while (currentExpr === lastQuestionText); // ถ้าซ้ำข้อเดิมให้สุ่มใหม่
  
  lastQuestionText = currentExpr;
  $("question").textContent = currentExpr + " = ?";

  let answers = [ans];
  while(answers.length<4){
    let w = ans + (Math.floor(Math.random()*11)-5);
    if(!answers.includes(w)) answers.push(w);
  }
  answers.sort(()=>Math.random()-0.5);
  correctIndex = answers.indexOf(ans);
  for(let i=0; i<4; i++) $("btn"+i).textContent = answers[i];

  timer = setInterval(()=>{
    if(!paused){
      time--; $("time").textContent=time;
      if(time<=0) fail(null);
    }
  },1000);
}

function choose(idx){
  if(paused) return;
  if(idx === correctIndex){
    playSFX('correct');
    $("btn"+idx).classList.add('success-pop');
    score += 10;
    if(isBonus) heart = Math.min(3, heart + 1);
    $("score").textContent = score; $("heart").textContent = heart;
    setTimeout(nextQuestion, 400);
  } else {
    playSFX('wrong');
    $("btn"+idx).classList.add('error-shake');
    fail(idx);
  }
}

function fail(idx){
  if(!isBonus) { heart--; $("heart").textContent = heart; }
  if(heart <= 0) setTimeout(gameOver, 400);
  else setTimeout(nextQuestion, 400);
}

function gameOver(){
  clearInterval(timer); stopAllBGM(); playSFX('over');
  $("final").textContent = score;
  let isNew = saveHighScore();
  $("newRecordMsg").style.display = isNew ? "block" : "none";
  showScreen('over');
}
</script>
</body>
</html>
