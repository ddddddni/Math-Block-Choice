<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Block Choice - Sound Edition</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,sans-serif;
  background:#f9fafb;
  height:100vh;
  overflow:hidden;
  transition:background .3s;
}

/* ---------- COMMON ---------- */
.screen{
  display:none;
  height:100vh;
  width:100%;
}
.active{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

button{
  border:none;
  cursor:pointer;
}
button.primary{
  background:#2563eb;
  color:white;
  font-size:20px;
  padding:16px 44px;
  border-radius:20px;
}
.big{font-size:64px;font-weight:800}

/* ---------- MENU DESIGN ---------- */
.menu-screen{
  position:relative;
  background:#ffffff;
  overflow:hidden;
}

.math-bg{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.math-bg span{
  position:absolute;
  font-size:90px;
  font-weight:900;
  color:#e5e7eb;
  opacity:0.9;
  animation:float 6s ease-in-out infinite;
}

.math-bg span:nth-child(1){top:8%;left:12%}
.math-bg span:nth-child(2){top:22%;right:10%}
.math-bg span:nth-child(3){bottom:25%;left:8%}
.math-bg span:nth-child(4){bottom:18%;right:16%}
.math-bg span:nth-child(5){top:55%;left:45%}
.math-bg span:nth-child(6){top:70%;right:35%}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}

.menu-content{
  position:relative;
  z-index:2;
  text-align:center;
  padding:20px;
}

.logo{
  font-size:56px;
  font-weight:900;
  line-height:1.1;
  margin-bottom:14px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:36px;
}

/* ---------- HUD ---------- */
.hud{
  position:fixed;
  top:0;left:0;
  width:100%;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#ffffffcc;
  backdrop-filter:blur(6px);
  z-index:10;
}
.hud-left{font-size:14px}
.hud-center{font-size:18px;font-weight:700}
.hud-right button{
  background:#e5e7eb;
  padding:6px 12px;
  border-radius:10px;
}

/* ---------- GAME ---------- */
.game{
  padding-top:70px;
  width:100%;
  max-width:420px;
  text-align:center;
}
.question{
  font-size:40px;
  margin:30px 0;
}

.choices{
  display:grid;
  grid-template-columns:repeat(2,140px);
  gap:20px;
  justify-content:center;
}

.choice{
  width:140px;
  height:80px;
  font-size:28px;
  color:white;
  border-radius:16px;
  transition:transform .15s;
  background:#2563eb;
}
.choice:active{transform:scale(.9)}
</style>
</head>

<body>

<audio id="bgMenu" loop src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3"></audio>
<audio id="bgGame" loop src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3"></audio>
<audio id="sndCount" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3"></audio>
<audio id="sndCorrect" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>
<audio id="sndWrong" src="https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3"></audio>

<div id="menu" class="screen active">
  <div class="math-bg">
    <span>＋</span><span>－</span><span>×</span><span>÷</span><span>＋</span><span>×</span>
  </div>
  <div class="menu-content">
    <h1 class="logo">Math<br>Block<br>Choice</h1>
    <p class="subtitle">คิดเร็ว • เลือกไว • ฝึกสมอง</p>
    <button class="primary" onclick="initGame()">เข้าสู่เกม</button>
  </div>
</div>

<div id="countdown" class="screen">
  <div class="big" id="countNum">3</div>
  <p>เตรียมพร้อม</p>
  <br>
  <button class="primary" onclick="skipCountdown()">ข้าม</button>
</div>

<div id="game" class="screen">
  <div class="hud">
    <div class="hud-left">
      ❤️ <span id="heart">3</span> | 🏆 <span id="score">0</span>
    </div>
    <div class="hud-center">
      ⏱ <span id="time">10</span>
    </div>
    <div class="hud-right">
      <button onclick="pauseGame()">หยุด</button>
    </div>
  </div>

  <div class="game">
    <div class="question" id="question"></div>
    <div class="choices">
      <button id="btn0" class="choice" onclick="choose(0)"></button>
      <button id="btn1" class="choice" onclick="choose(1)"></button>
      <button id="btn2" class="choice" onclick="choose(2)"></button>
      <button id="btn3" class="choice" onclick="choose(3)"></button>
    </div>
  </div>
</div>

<div id="pause" class="screen">
  <h2>หยุดเกม</h2>
  <br>
  <button class="primary" onclick="resumeGame()">เล่นต่อ</button>
  <br><br>
  <button onclick="backMenu()">กลับหน้าแรก</button>
</div>

<div id="over" class="screen">
  <div class="big">GAME OVER</div>
  <p>คะแนน: <span id="final"></span></p>
  <br>
  <button class="primary" onclick="startGame()">เล่นอีกครั้ง</button>
  <br><br>
  <button onclick="backMenu()">กลับหน้าแรก</button>
</div>

<script>
let score=0, heart=3, time=10;
let timer=null, paused=false, correctIndex=0, countdownTimer=null;

const $ = id => document.getElementById(id);

// ฟังก์ชันเปิดเสียงหน้าแรก (เพราะเบราว์เซอร์บังคับให้ต้องกดก่อนถึงจะเล่นเสียงได้)
function initGame() {
  $("bgMenu").volume = 0.5;
  $("bgMenu").play();
  startGame();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function startGame(){
  score=0; heart=3; 
  $("score").textContent=score;
  $("heart").textContent=heart;
  
  // จัดการเสียง
  $("bgMenu").pause();
  $("bgMenu").currentTime = 0;
  
  startCountdown();
}

function startCountdown(){
  showScreen('countdown');
  let c=3;
  $("countNum").textContent=c;
  
  // เสียงนับถอยหลังครั้งแรก
  $("sndCount").currentTime = 0;
  $("sndCount").play();
  
  clearInterval(countdownTimer);
  countdownTimer=setInterval(()=>{
    c--;
    if(c>0) {
      $("countNum").textContent=c;
      $("sndCount").currentTime = 0;
      $("sndCount").play();
    } else { 
      clearInterval(countdownTimer); 
      showGame(); 
    }
  },1000);
}

function skipCountdown(){
  clearInterval(countdownTimer);
  showGame();
}

function showGame(){
  showScreen('game');
  $("bgGame").volume = 0.4;
  $("bgGame").play();
  nextQuestion();
}

function nextQuestion(){
  clearInterval(timer);
  time=10;
  $("time").textContent=time;

  const ops=["+","-","×","÷"];
  const op=ops[Math.floor(Math.random()*ops.length)];
  let a, b, ans;

  if(op==="+"){ a=Math.floor(Math.random()*20)+1; b=Math.floor(Math.random()*20)+1; ans=a+b; }
  else if(op==="-"){ a=Math.floor(Math.random()*20)+10; b=Math.floor(Math.random()*9)+1; ans=a-b; }
  else if(op==="×"){ a=Math.floor(Math.random()*9)+1; b=Math.floor(Math.random()*9)+1; ans=a*b; }
  else { b=Math.floor(Math.random()*9)+1; ans=Math.floor(Math.random()*9)+1; a=b*ans; }

  $("question").textContent=`${a} ${op} ${b}`;

  let answers=[ans];
  while(answers.length<4){
    let w=ans+(Math.floor(Math.random()*15)-7);
    if(w>=0 && !answers.includes(w)) answers.push(w);
  }
  answers.sort(()=>Math.random()-0.5);
  correctIndex=answers.indexOf(ans);

  for(let i=0; i<4; i++) $("btn"+i).textContent=answers[i];

  timer=setInterval(()=>{
    if(!paused){
      time--;
      $("time").textContent=time;
      if(time<=0) fail();
    }
  },1000);
}

function choose(idx){
  if(idx===correctIndex){
    // เสียงตอบถูก
    $("sndCorrect").currentTime = 0;
    $("sndCorrect").play();
    score+=10;
    $("score").textContent=score;
    nextQuestion();
  } else {
    // เสียงตอบผิด
    $("sndWrong").currentTime = 0;
    $("sndWrong").play();
    fail();
  }
}

function fail(){
  heart--;
  $("heart").textContent=heart;
  if(heart<=0) gameOver();
  else nextQuestion();
}

function gameOver(){
  clearInterval(timer);
  $("bgGame").pause();
  $("bgGame").currentTime = 0;
  $("sndWrong").play(); // เล่นเสียงจบเกม
  $("final").textContent=score;
  showScreen('over');
}

function pauseGame(){ 
  paused=true; 
  $("bgGame").pause();
  showScreen('pause'); 
}

function resumeGame(){ 
  paused=false; 
  $("bgGame").play();
  showScreen('game'); 
}

function backMenu(){ 
  clearInterval(timer); 
  $("bgGame").pause();
  $("bgGame").currentTime = 0;
  $("bgMenu").play();
  showScreen('menu'); 
}
</script>
</body>
</html>
